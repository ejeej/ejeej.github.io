{% include base_path %}

<section class="page__share">
  {% if site.data.ui-text[site.locale].share_on_label %}
    <h4 class="page__share-title">{{ site.data.ui-text[site.locale].share_on_label | default: "Поделиться" }}</h4>
  {% endif %}

  <a href="https://t.me/share/url?url={{ base_path }}{{ page.url | url_encode }}" class="btn btn--telegram" title="Share on Telegram"> <i class="fab fa-telegram" aria-hidden="true"></i><span> Telegram</span></a>
</section>
